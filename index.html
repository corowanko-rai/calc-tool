<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>調剤ツール</title>
<meta name="theme-color" content="#0a4a40">
<style>
:root{
  --ink:#1c2b2e;
  --ink-soft:#4b5d60;
  --ink-faint:#8a9494;
  --paper:#f6f4ee;
  --panel:#ffffff;
  --line:#dcd6c8;
  --accent:#0f6b5c;
  --accent-soft:#e3efe9;
  --accent-deep:#0a4a40;
  --radius:14px;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
/* うっすらとした紙の質感（斜めの罫線）。主張しすぎない程度に */
body{
  background-image:
    linear-gradient(180deg, rgba(10,74,64,0.03) 0%, rgba(10,74,64,0) 140px),
    repeating-linear-gradient(-45deg, rgba(28,43,46,0.015) 0 1px, transparent 1px 26px);
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:44px 20px 40px;
  display:flex;
  flex-direction:column;
}

header{
  margin-bottom:34px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--accent-deep);
  font-weight:700;
  margin-bottom:14px;
}
.eyebrow::before{
  content:"";
  width:18px;height:1.5px;
  background:var(--accent-deep);
  display:inline-block;
}
h1{
  font-size:clamp(26px, 6vw, 34px);
  font-weight:800;
  letter-spacing:.02em;
  margin:0 0 10px;
  color:var(--ink);
}
.lead{
  font-size:14.5px;
  color:var(--ink-soft);
  line-height:1.75;
  margin:0;
  max-width:46ch;
}

.shelf{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  margin-top:8px;
}
@media (min-width:600px){
  .shelf{grid-template-columns:1fr 1fr;}
}

.card{
  position:relative;
  display:flex;
  align-items:stretch;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  text-decoration:none;
  color:inherit;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(28,43,46,0.04);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.card:active{
  transform:translateY(1px) scale(.996);
}
.card:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}
@media (hover:hover){
  .card:hover{
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(10,74,64,0.10);
  }
  .card:hover .go{ transform:translateX(3px); }
}
@media (prefers-reduced-motion:reduce){
  .card, .go{ transition:none; }
}

/* 棚札（シェルフラベル）風のタブ：薬棚の仕切り札を模したサイン */
.tab{
  flex:0 0 12px;
  background:var(--accent-deep);
  position:relative;
}
.tab::after{
  content:"";
  position:absolute;
  left:50%; top:22px;
  width:5px;height:5px;
  border-radius:999px;
  background:var(--paper);
  transform:translateX(-50%);
  box-shadow:0 34px 0 var(--paper);
}

.card-body{
  flex:1;
  padding:20px 18px 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.icon{
  width:38px;height:38px;
  flex:0 0 auto;
  border-radius:10px;
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-deep);
}
.icon svg{width:20px;height:20px;}

.tag{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.04em;
  color:var(--ink-faint);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 9px;
  white-space:nowrap;
}

.card-title{
  font-size:18px;
  font-weight:800;
  color:var(--ink);
  letter-spacing:.01em;
}
.card-desc{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0;
}

.go{
  margin-top:auto;
  padding-top:6px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:700;
  color:var(--accent-deep);
  transition:transform .14s ease;
}
.go svg{width:14px;height:14px;}

footer{
  margin-top:32px;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--ink-faint);
  line-height:1.7;
}
footer a{ color:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">調剤ツール</div>
    <h1>ツールを選んでください</h1>
    <p class="lead">タップして開きます。</p>
  </header>

  <div class="shelf" id="shelf"></div>

  <footer>
    一度開いたページは、オフラインでも起動できます。
  </footer>
</div>

<script>
'use strict';

/* ============================================================
   ツール一覧
   ============================================================
   新しいアプリを追加したいときは、この配列に1件追加するだけでOK。
   カードのHTML・CSSは書き換える必要はありません。

   各項目：
     href     : アプリの場所（例 './mix/'）
     category : カード右上に出す小さいタグの文字（例 '水剤'）
     title    : カードの見出し
     desc     : 1〜2行の説明文
     icon     : アイコンの種類。下のICONSに用意されているキーを指定。
                未指定・未登録のキーを指定した場合は自動的に既定アイコンになる。
*/
const TOOLS = [
  {
    href: './mix/',
    category: '水剤',
    title: '水剤MIX調製計算',
    desc: '複数の水剤を混合し、1回量が割り切れる単位になるよう賦形量を算出します。',
    icon: 'liquid',
  },
  {
    href: './ontmix/',
    category: '軟膏',
    title: '軟膏ツボ選択',
    desc: '軟膏MIXの配合比を保ったまま、壺の組み合わせと充填量をすばやく算出します。',
    icon: 'ointment',
  },
  {
    href: './dfconv/',
    category: '換算',
    title: '剤形変更 換算',
    desc: '散剤・水剤・錠剤の剤形変更を成分量ベースで換算し、疑義照会メモを作ります。',
    icon: 'convert',
  },
  // ここに追加していく。例：
  // {
  //   href: './powder/',
  //   category: '散剤',
  //   title: '散剤分包計算',
  //   desc: '散剤の分包量を計算します。',
  //   icon: 'powder',
  // },
];

/* アイコン集。中身は<svg>の中に入れるパス文字列。
   新しいカテゴリのアイコンを増やしたいときは、ここにキーを追加する。
   ICONSに無いキーが指定された場合は自動的に 'default' が使われる。 */
const ICONS = {
  liquid: '<path d="M10.5 2.5h3M11 3v5.2c0 .5-.15.98-.44 1.38L5.9 16.2A3.5 3.5 0 0 0 8.72 21.5h6.56a3.5 3.5 0 0 0 2.82-5.3l-4.66-6.62A2.5 2.5 0 0 1 13 7.2V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 15.5h8.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  ointment: '<path d="M8.5 9.2 9.3 4h5.4l.8 5.2" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.6 9h8.8l1.1 10.2a1.8 1.8 0 0 1-1.79 2H8.29a1.8 1.8 0 0 1-1.79-2L7.6 9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  powder: '<path d="M6 14.5c0 3.6 2.7 6 6 6s6-2.4 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.5 14.5h15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v6.2M9.3 6.3 12 9l2.7-2.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  injection: '<path d="m17.5 3.5 3 3M14 7l6 6M4 20l3.2-.6a2 2 0 0 0 1.06-.56L18.2 8.9a1.5 1.5 0 0 0 0-2.12l-1-1a1.5 1.5 0 0 0-2.12 0L5.16 15.74a2 2 0 0 0-.56 1.06L4 20Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  convert: '<path d="M4 9h13.5M14.5 5.8 17.8 9l-3.3 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15H6.5M9.5 11.8 6.2 15l3.3 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  default: '<rect x="4.5" y="3.5" width="15" height="17" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M8 8h8M8 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
};

const ARROW_SVG = '<path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';

function renderTools(tools) {
  const shelf = document.getElementById('shelf');
  shelf.innerHTML = '';

  if (!tools || tools.length === 0) {
    const empty = document.createElement('p');
    empty.style.cssText = 'color:var(--ink-faint);font-size:13px;';
    empty.textContent = 'ツールがまだ登録されていません。';
    shelf.appendChild(empty);
    return;
  }

  tools.forEach(tool => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = tool.href;

    const tab = document.createElement('div');
    tab.className = 'tab';
    card.appendChild(tab);

    const body = document.createElement('div');
    body.className = 'card-body';

    const top = document.createElement('div');
    top.className = 'card-top';

    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${ICONS[tool.icon] || ICONS.default}</svg>`;
    top.appendChild(icon);

    if (tool.category) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = tool.category;
      top.appendChild(tag);
    }
    body.appendChild(top);

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = tool.title;
    body.appendChild(title);

    const desc = document.createElement('p');
    desc.className = 'card-desc';
    desc.textContent = tool.desc || '';
    body.appendChild(desc);

    const go = document.createElement('div');
    go.className = 'go';
    go.innerHTML = `開く <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${ARROW_SVG}</svg>`;
    body.appendChild(go);

    card.appendChild(body);
    shelf.appendChild(card);
  });
}

renderTools(TOOLS);
</script>
</body>
</html>
