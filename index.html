<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 読み込めるのは自分のサイトのファイルだけ。画面に書き込めるのは app.js が許可した決まった SVG だけ（Trusted Types） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types portal">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>調剤ツール</title>
<meta name="theme-color" content="#0a4a40">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="調剤ツール">
<style>
:root{
  --ink:#1c2b2e;
  --ink-soft:#4b5d60;
  --ink-faint:#8a9494;
  --paper:#f6f4ee;
  --panel:#ffffff;
  --line:#dcd6c8;
  --accent:#0f6b5c;
  --accent-soft:#e3efe9;
  --accent-deep:#0a4a40;
  --radius:14px;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
/* うっすらとした紙の質感（斜めの罫線）。主張しすぎない程度に */
body{
  background-image:
    linear-gradient(180deg, rgba(10,74,64,0.03) 0%, rgba(10,74,64,0) 140px),
    repeating-linear-gradient(-45deg, rgba(28,43,46,0.015) 0 1px, transparent 1px 26px);
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:44px 20px 40px;
  display:flex;
  flex-direction:column;
}

header{
  margin-bottom:34px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--accent-deep);
  font-weight:700;
  margin-bottom:14px;
}
.eyebrow::before{
  content:"";
  width:18px;height:1.5px;
  background:var(--accent-deep);
  display:inline-block;
}
h1{
  font-size:clamp(26px, 6vw, 34px);
  font-weight:800;
  letter-spacing:.02em;
  margin:0 0 10px;
  color:var(--ink);
}
.lead{
  font-size:14.5px;
  color:var(--ink-soft);
  line-height:1.75;
  margin:0;
  max-width:46ch;
}

.shelf{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  margin-top:8px;
}
@media (min-width:600px){
  .shelf{grid-template-columns:1fr 1fr;}
}

.card{
  position:relative;
  display:flex;
  align-items:stretch;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  text-decoration:none;
  color:inherit;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(28,43,46,0.04);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.card:active{
  transform:translateY(1px) scale(.996);
}
.card:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}
@media (hover:hover){
  .card:hover{
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(10,74,64,0.10);
  }
  .card:hover .go{ transform:translateX(3px); }
}
@media (prefers-reduced-motion:reduce){
  .card, .go{ transition:none; }
}

/* 棚札（シェルフラベル）風のタブ：薬棚の仕切り札を模したサイン */
.tab{
  flex:0 0 12px;
  background:var(--accent-deep);
  position:relative;
}
.tab::after{
  content:"";
  position:absolute;
  left:50%; top:22px;
  width:5px;height:5px;
  border-radius:999px;
  background:var(--paper);
  transform:translateX(-50%);
  box-shadow:0 34px 0 var(--paper);
}

.card-body{
  flex:1;
  padding:20px 18px 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.icon{
  width:38px;height:38px;
  flex:0 0 auto;
  border-radius:10px;
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-deep);
}
.icon svg{width:20px;height:20px;}

.tag{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.04em;
  color:var(--ink-faint);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 9px;
  white-space:nowrap;
}

.card-title{
  font-size:18px;
  font-weight:800;
  color:var(--ink);
  letter-spacing:.01em;
}
.card-desc{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0;
}

.go{
  margin-top:auto;
  padding-top:6px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:700;
  color:var(--accent-deep);
  transition:transform .14s ease;
}
.go svg{width:14px;height:14px;}

footer{
  margin-top:32px;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--ink-faint);
  line-height:1.7;
}
footer a{ color:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">調剤ツール</div>
    <h1>ツールを選んでください</h1>
    <p class="lead">タップして開きます。</p>
  </header>

  <div class="shelf" id="shelf"></div>

  <footer>
    一度開いたページは、オフラインでも起動できます。
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
